name: Import
on:
  schedule:
    # 03:00 UTC: 04:00 BST / 03:00 GMT. GitHub may start scheduled runs late.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      feeds:
        description: Space-separated feed numbers to import, e.g. "2 3" (blank for all)
        required: false
        default: ""
permissions:
  contents: read
  actions: write # only for the keepalive step below
concurrency:
  group: import
  cancel-in-progress: false
jobs:
  import:
    name: Import
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Public repo: the script never prints importer output. Do not add `set -x`
      # or echo any of these values.
      - name: Import transactions
        run: scripts/daily-import.sh
        env:
          FEEDS: ${{ inputs.feeds }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FIREFLY_PAT: ${{ secrets.FIREFLY_PAT }}
          IMPORT_CONFIG_1: ${{ secrets.IMPORT_CONFIG_1 }}
          IMPORT_CONFIG_2: ${{ secrets.IMPORT_CONFIG_2 }}
          IMPORT_CONFIG_3: ${{ secrets.IMPORT_CONFIG_3 }}
          IMPORT_CONFIG_4: ${{ secrets.IMPORT_CONFIG_4 }}
      # GitHub disables scheduled workflows in a public repo after 60 days
      # without repository activity. Re-enabling the workflow is a best-effort
      # way to keep the schedule alive; check the Actions tab if runs stop.
      - name: Keep schedule alive
        if: github.event_name == 'schedule' && always()
        continue-on-error: true
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/import.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
