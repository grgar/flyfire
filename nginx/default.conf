server {
	listen 8080 default_server;
	listen [::]:8080 default_server;
	root /var/www/html/public;
	index index.html index.htm index.php;
	server_name $FIREFLY_HOST;
	charset utf-8;
	client_max_body_size 2048M;
	access_log /dev/stdout fly;
	error_log /dev/stderr warn;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

 	location ~ [^/]\\.php(/|$) {
		fastcgi_split_path_info ^(.+?\\.php)(/.*)$;
		if (!-f $document_root$fastcgi_script_name) {
			return 404;
		}
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
		fastcgi_param HTTP_X_FORWARDED_FOR $http_fly_client_ip;
		fastcgi_param APP_URL $FIREFLY_APP_URL;
		fastcgi_pass localhost:9000;
		fastcgi_index index.php;
		fastcgi_buffering off;
		fastcgi_connect_timeout 600;
		fastcgi_send_timeout 600;
		fastcgi_read_timeout 600;
		send_timeout 600;
	}

	# The MCP server has no per-request authorisation of its own — it holds one
	# Personal Access Token and uses it for every request — so authorisation is
	# enforced here, before anything reaches it.
	location = /mcp {
		if ($request_method = OPTIONS) {
			return 204;
		}

		auth_request /_mcp_auth;
		error_page 401 403 = @mcp_unauthorized;

		proxy_pass http://127.0.0.1:3000/mcp;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 600;
		proxy_send_timeout 600;
		send_timeout 600;

		add_header Access-Control-Allow-Origin "*" always;
		add_header Access-Control-Allow-Headers "authorization, content-type, mcp-session-id, mcp-protocol-version, last-event-id" always;
		add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
		add_header Access-Control-Expose-Headers "mcp-session-id" always;
		add_header Access-Control-Max-Age 86400 always;
	}

	location = /_mcp_auth {
		internal;

		# Static token, for clients that can't do OAuth. When MCP_TOKEN is unset
		# the entrypoint substitutes a random value here, so this never matches.
		if ($http_authorization = "Bearer $MCP_TOKEN") {
			return 204;
		}

		# Otherwise the token has to be one Firefly issued itself: hand it back
		# to Firefly's own API and let Passport judge signature, expiry, scope
		# and revocation. 2xx admits the request, anything else rejects it.
		proxy_pass $MCP_AUTH_PROBE;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host $FIREFLY_HOST;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Authorization $http_authorization;
		# Laravel answers an unauthenticated request it doesn't think wants JSON
		# with a redirect to the login page rather than a 401.
		proxy_set_header Accept application/json;

		# auth_request only understands 2xx, 401 and 403 and turns anything else
		# into a 500, so refuse on any other answer rather than serving one.
		proxy_intercept_errors on;
		error_page 301 302 303 307 308 400 404 405 500 502 503 504 = @mcp_auth_deny;
	}

	location @mcp_auth_deny {
		return 403;
	}

	# RFC 9728 §5.1: point clients at the metadata describing who issues tokens.
	location @mcp_unauthorized {
		default_type application/json;
		add_header WWW-Authenticate 'Bearer resource_metadata="$MCP_PUBLIC_URL/.well-known/oauth-protected-resource"' always;
		add_header Access-Control-Allow-Origin "*" always;
		return 401 '{"error":"unauthorized"}';
	}

	# OAuth discovery. Firefly is its own authorisation server (Laravel Passport),
	# so these just describe endpoints Firefly already serves. Deliberately no
	# registration_endpoint: Passport has no dynamic client registration, and
	# omitting it makes clients fall back to a manually entered ID and secret.
	location = /.well-known/oauth-protected-resource {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		return 200 '{"resource":"$MCP_PUBLIC_URL/mcp","authorization_servers":["$MCP_PUBLIC_URL"],"bearer_methods_supported":["header"]}';
	}

	location = /.well-known/oauth-protected-resource/mcp {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		return 200 '{"resource":"$MCP_PUBLIC_URL/mcp","authorization_servers":["$MCP_PUBLIC_URL"],"bearer_methods_supported":["header"]}';
	}

	location = /.well-known/oauth-authorization-server {
		default_type application/json;
		add_header Access-Control-Allow-Origin "*" always;
		return 200 '{"issuer":"$MCP_PUBLIC_URL","authorization_endpoint":"$MCP_PUBLIC_URL/oauth/authorize","token_endpoint":"$MCP_PUBLIC_URL/oauth/token","response_types_supported":["code"],"grant_types_supported":["authorization_code","refresh_token"],"code_challenge_methods_supported":["S256"],"token_endpoint_auth_methods_supported":["client_secret_post","client_secret_basic"]}';
	}

	location = /favicon.ico {
		log_not_found off;
		access_log off;
	}

	location = /robots.txt {
		log_not_found off;
		access_log off;
	}

	location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?|ttf|ttc|otf|eot|woff2?)$ {
		expires 7d;
		access_log off;
		log_not_found off;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

