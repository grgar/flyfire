server {
	listen 8080 default_server;
	listen [::]:8080 default_server;
	root /var/www/html/public;
	index index.html index.htm index.php;
	server_name $FIREFLY_HOST;
	charset utf-8;
	client_max_body_size 2048M;
	access_log /dev/stdout fly;
	error_log /dev/stderr warn;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

 	location ~ [^/]\\.php(/|$) {
		fastcgi_split_path_info ^(.+?\\.php)(/.*)$;
		if (!-f $document_root$fastcgi_script_name) {
			return 404;
		}
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
		fastcgi_param HTTP_X_FORWARDED_FOR $http_fly_client_ip;
		fastcgi_param APP_URL $FIREFLY_APP_URL;
		fastcgi_pass localhost:9000;
		fastcgi_index index.php;
		fastcgi_buffering off;
		fastcgi_connect_timeout 600;
		fastcgi_send_timeout 600;
		fastcgi_read_timeout 600;
		send_timeout 600;
	}

	location = /mcp {
		if ($http_authorization != "Bearer $MCP_TOKEN") {
			return 401;
		}
		proxy_pass http://127.0.0.1:3000/mcp;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 600;
		proxy_send_timeout 600;
		send_timeout 600;
	}

	location = /favicon.ico {
		log_not_found off;
		access_log off;
	}

	location = /robots.txt {
		log_not_found off;
		access_log off;
	}

	location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?|ttf|ttc|otf|eot|woff2?)$ {
		expires 7d;
		access_log off;
		log_not_found off;
	}

	location ~ /\.(?!well-known) {
		deny all;
	}

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

